<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Project 6: Class Timetable</title>
</head>
<body>
<!-- Learn: tables (table, tr, th, td, caption, colspan). The border attribute shows lines. -->
<h1>🗓️ My Class Timetable</h1>
<table border="1" cellpadding="8">
  <caption>SS 1 Weekly Timetable</caption>
  <thead>
    <tr><th>Time</th><th>Monday</th><th>Tuesday</th><th>Wednesday</th></tr>
  </thead>
  <tbody>
    <tr><td>8:00</td><td>Maths</td><td>English</td><td>Computer</td></tr>
    <tr><td>9:00</td><td>Physics</td><td>Maths</td><td>Biology</td></tr>
    <tr><td colspan="4" align="center"><strong>☕ Break</strong></td></tr>
    <tr><td>10:30</td><td>Civic</td><td>Chemistry</td><td>Maths</td></tr>
  </tbody>
</table>
<!-- Challenge: add Thursday and Friday columns. -->
</body>
</html>
